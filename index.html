<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accountize – Premium Personal Finance & Cash Reconciliation Ledger by iNexarum</title>

    <style>
      /* Pre-load Critical CSS to prevent Flash of Unstyled Content (FOUC) */
      .preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, #ffffff 0%, #f8fafc 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
      }

      .preloader.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      .preloader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      .spinner-container {
        position: relative;
        width: 80px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .spinner-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 3px solid rgba(42, 73, 140, 0.08);
        border-top: 3px solid #2a498c;
        border-right: 3px solid #8c97e7;
        border-radius: 50%;
        animation: preloader-spin 1.2s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
      }

      .preloader-icon-container {
        position: relative;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2a498c;
        animation: preloader-pulse-icon 2s infinite ease-in-out;
      }

      .preloader-svg {
        width: 30px;
        height: 30px;
        stroke: #2a498c;
        transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s ease;
        filter: drop-shadow(0 2px 8px rgba(42, 73, 140, 0.15));
      }

      @keyframes preloader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes preloader-pulse-icon {
        0%, 100% {
          transform: scale(1);
          opacity: 0.9;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    
    <!-- SEO Optimization -->
    <meta name="description" content="Reconcile bank statements, track daily budgets, share group ledgers, and detect discrepancies automatically. The premium, secure Excel replacement for personal finance." />
    <meta name="keywords" content="personal finance, cash ledger, budget tracker, bank reconciliation, expense tracker, shared ledgers, finance tracker, double entry book" />
    <meta name="author" content="iNexarum" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://accountize.inexarum.in/" />
    <meta property="og:title" content="Accountize | Premium Personal Finance & Cash Reconciliation" />
    <meta property="og:description" content="Reconcile bank statements, track daily budgets, share group ledgers, and detect discrepancies automatically. The premium, secure Excel replacement for personal finance." />
    <meta property="og:image" content="/logo-512.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://accountize.inexarum.in/" />
    <meta property="twitter:title" content="Accountize | Premium Personal Finance & Cash Reconciliation" />
    <meta property="twitter:description" content="Reconcile bank statements, track daily budgets, share group ledgers, and detect discrepancies automatically. The premium, secure Excel replacement for personal finance." />
    <meta property="twitter:image" content="/logo-512.png" />
  </head>
  <body>
    <!-- Premium Preloader -->
    <div id="preloader" class="preloader">
      <div class="preloader-content">
        <div class="spinner-container">
          <div class="spinner-ring"></div>
          <div id="preloader-icon-container" class="preloader-icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="preloader-svg"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function() {
        const icons = [
          `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="preloader-svg"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>`,
          `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="preloader-svg"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>`,
          `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="preloader-svg"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"></path></svg>`,
          `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="preloader-svg"><rect x="4" y="4" width="16" height="16" rx="2"></rect><rect x="9" y="9" width="6" height="6"></rect><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3"></path></svg>`,
          `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="preloader-svg"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>`
        ];

        let index = 0;
        const iconContainer = document.getElementById("preloader-icon-container");
        
        const interval = setInterval(() => {
          index = (index + 1) % icons.length;
          
          if (iconContainer) {
            const currentSvg = iconContainer.querySelector("svg");
            if (currentSvg) {
              currentSvg.style.transform = "scale(0) rotate(-45deg)";
              currentSvg.style.opacity = "0";
            }
            
            setTimeout(() => {
              iconContainer.innerHTML = icons[index];
              const newSvg = iconContainer.querySelector("svg");
              if (newSvg) {
                newSvg.style.transform = "scale(0) rotate(45deg)";
                newSvg.style.opacity = "0";
                newSvg.getBoundingClientRect();
                newSvg.style.transform = "scale(1) rotate(0deg)";
                newSvg.style.opacity = "1";
              }
            }, 150);
          }
        }, 400);

        const observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            if (mutation.attributeName === "class" && mutation.target.classList.contains("fade-out")) {
              clearInterval(interval);
              observer.disconnect();
            }
          });
        });
        const preloader = document.getElementById("preloader");
        if (preloader) {
          observer.observe(preloader, { attributes: true });
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
